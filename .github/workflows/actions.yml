name: GitHub Actions
run-name: ${{ github.actor }} is testing out the train pipeline 🚀
on: [push]

jobs:
  train-pipeline:
    name: Train Model
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.4
          cache: false

      - name: Train Model
        uses: dagger/dagger-for-github@v6
        with:
          verb: run
          args: go run pipeline.go
          version: "0.19.7"
        
      # 1. Save EVERYTHING (for you to download/debug)
      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: models/

      # 2. Prepare & Upload SPECIFIC file for the Validator Action
      - name: Prepare Model for Validator
        run: |
          mkdir -p validation_upload
          cp models/deployed_model/model.pkl validation_upload/model.pkl

      - name: Upload Model for Validator
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: validation_upload/model.pkl
  
  test-pipeline:
    name: Test Model
    runs-on: ubuntu-latest
    needs: train-pipeline
    steps:
      - run: echo "🎉 Starting inference test on the trained model..."    
      
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: model

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install scikit-learn pandas joblib xgboost 

      - name: Run inference test
        run: |
          import pandas as pd
          import joblib
          import numpy as np
          
          # Load the downloaded model
          with open("model/model.pkl", "rb") as f:
              model = joblib.load(f)
          
          # (Add your test data loading and assertion logic here...)
          print("Model loaded successfully with XGBoost installed!")
        shell: python